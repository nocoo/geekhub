name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Successful main CI run ID to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      runtime-version: '1.4.0'
      node-version: '26.8.1'
      install-policy: trusted
      wrangler-version: '4.131.1'
      deploy-script: bun run deploy
      environment: Production
      concurrency-group: deploy-geekhub-production
      verify-command: |
        response=$(mktemp)
        trap 'rm -f "$response"' EXIT
        status=$(curl --silent --show-error --max-time 20 --output "$response" --write-out '%{http_code}' https://geekhub.hexly.ai/api/live)
        test "$status" = 200
        jq -e --arg version "$(jq -r .version package.json)" '.status == "ok" and .storage == "d1" and .version == $version' "$response"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
