name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    needs: [quality]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      auto-rollback: true
      runtime-version: "1.4.0"
      install-policy: trusted
      artifact-name: b1-dist
      artifact-path: "."
      d1-migrations: true
      d1-databases: geekhub-db
      environment: production
      concurrency-group: deploy-geekhub-production
      verify-command: |
        response=$(mktemp)
        trap 'rm -f "$response"' EXIT
        status=$(curl --silent --show-error --max-time 20 --output "$response" --write-out '%{http_code}' https://geekhub.hexly.ai/api/live)
        test "$status" = 200
        jq -e --arg version "$(jq -r .version package.json)" '.status == "ok" and .storage == "d1" and .version == $version' "$response"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
