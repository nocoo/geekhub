# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L2/L3 artifacts.
name: CI

on:
  push:
    branches: [main, rewrite/cloudflare-reader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geekhub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: '1.4.0'
      node-version: '26.12.1'
      install-policy: trusted
      prepare-command: bun run setup
      test-command: bun run test:coverage
      coverage-path: coverage/
      coverage-artifact-name: coverage
      build: true
      build-command: bun run build
      security: true
      gitleaks-config: .gitleaks.toml
      security-command: bun run gate:security
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:l2
      l2-artifact-name: l2-evidence
      l2-artifact-path: |
        test-results/
      l2-artifact-retention-days: 14
      l3: true
      l3-browsers: chromium
      l3-prepare-command: bun run setup
      l3-command: bun run test:l3
      l3-artifact-name: l3-evidence
      l3-artifact-path: |
        test-results/
        playwright-report/
      l3-artifact-retention-days: 14
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "无独立 @cloudflare/vitest-pool-workers 套件；绑定与 HTTP 集成由 L2/L3 的 run-tests.ts 覆盖"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
